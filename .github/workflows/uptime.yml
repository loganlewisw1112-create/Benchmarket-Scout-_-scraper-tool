name: Uptime Monitor

# Best-effort only. GitHub treats schedules as low priority: this "*/10" cron
# was observed running only ~2-9 times a day (median gap ~2h, max ~12h) in
# Aug-Sep 2026, so an outage can go unnoticed for hours. Use an external
# uptime service for minute-level detection; this job is a backstop.
# workflow_dispatch allows a manual on-demand check.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: uptime-monitor
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  HEALTH_URL: https://benchmark-scout.vercel.app/api/health
  SITE_URL: https://benchmark-scout.vercel.app/
  ISSUE_TITLE: "Production uptime check failing"
  ISSUE_LABEL: uptime

# Every value derived from an HTTP response is reduced to a whitelisted
# character set before it reaches $GITHUB_OUTPUT, and step outputs are passed
# to later scripts only through env:, never spliced into run: with ${{ }}.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check health endpoint
        id: health
        run: |
          set +e
          body="$(mktemp)"
          # No --retry: a 503 is a real answer here, and health is memoized
          # for 30s, so an immediate retry would return the same thing.
          http_code=$(curl -sS --max-time 15 -o "$body" -w '%{http_code}' "$HEALTH_URL")
          curl_exit=$?
          http_code=$(printf '%s' "$http_code" | tr -cd '0-9' | head -c 3)
          echo "http_code=$http_code" >> "$GITHUB_OUTPUT"

          if [ "$curl_exit" -ne 0 ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "key=health:curl_exit_$curl_exit" >> "$GITHUB_OUTPUT"
            echo "reason=curl failed (exit $curl_exit) contacting the health endpoint" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! jq -e 'type == "object"' "$body" >/dev/null 2>&1; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "key=health:http_${http_code}:non_json" >> "$GITHUB_OUTPUT"
            echo "reason=Health endpoint returned HTTP $http_code with a non-JSON body" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          status=$(jq -r '.status // "missing" | tostring' "$body" | tr -cd 'a-z_' | head -c 32)
          alert_reasons=$(jq -r '(.alertReasons // []) | map(tostring) | join(",")' "$body" | tr -cd 'A-Z_,' | head -c 200)
          active_samples=$(jq -r '.activeSampleCount // "" | tostring' "$body" | tr -cd '0-9' | head -c 6)
          oldest_hours=$(jq -r '.oldestSampleAgeHours // "" | tostring' "$body" | tr -cd '0-9.' | head -c 12)
          detail="status=${status:-none}, alertReasons=[${alert_reasons}], activeSampleCount=${active_samples:-n/a}, oldestServedSampleAgeHours=${oldest_hours:-n/a}"

          # "maintenance" is a deliberate, documented state (DEPLOY.md), not an outage.
          if [ "$http_code" = "200" ] && { [ "$status" = "ok" ] || [ "$status" = "maintenance" ]; }; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "reason=HTTP 200, $detail" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ok=false" >> "$GITHUB_OUTPUT"
          echo "key=health:http_${http_code}:${status}:${alert_reasons}" >> "$GITHUB_OUTPUT"
          echo "reason=Health endpoint returned HTTP $http_code, $detail" >> "$GITHUB_OUTPUT"

      - name: Check landing page
        id: landing
        run: |
          set +e
          http_code=$(curl -sS --retry 2 --retry-delay 5 --max-time 15 -o /dev/null -w '%{http_code}' "$SITE_URL")
          curl_exit=$?
          http_code=$(printf '%s' "$http_code" | tr -cd '0-9' | head -c 3)
          echo "http_code=$http_code" >> "$GITHUB_OUTPUT"

          if [ "$curl_exit" -ne 0 ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "key=landing:curl_exit_$curl_exit" >> "$GITHUB_OUTPUT"
            echo "reason=curl failed (exit $curl_exit) contacting the landing page" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$http_code" != "200" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "key=landing:http_$http_code" >> "$GITHUB_OUTPUT"
            echo "reason=Landing page returned HTTP $http_code (expected 200)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "reason=HTTP 200" >> "$GITHUB_OUTPUT"

      # Issue lifecycle:
      #   failing, no open issue   -> create one
      #   failing, open issue      -> edit its body with the latest status and
      #                               time; comment only when the failure
      #                               signature changes
      #   passing, open issue      -> one recovery comment, then close
      - name: Update uptime issue
        env:
          HEALTH_OK: ${{ steps.health.outputs.ok }}
          HEALTH_KEY: ${{ steps.health.outputs.key }}
          HEALTH_REASON: ${{ steps.health.outputs.reason }}
          LANDING_OK: ${{ steps.landing.outputs.ok }}
          LANDING_KEY: ${{ steps.landing.outputs.key }}
          LANDING_REASON: ${{ steps.landing.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          now="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$ISSUE_LABEL" --state open \
            --search "\"$ISSUE_TITLE\" in:title" --json number --jq '.[0].number // empty' | tr -cd '0-9')

          if [ "$HEALTH_OK" = "true" ] && [ "$LANDING_OK" = "true" ]; then
            if [ -n "$number" ]; then
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" \
                --body "Recovered: both checks passed at $now. Health: $HEALTH_REASON. Run: $RUN_URL"
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" --reason completed
            fi
            exit 0
          fi

          signature=""
          if [ "$HEALTH_OK" != "true" ]; then signature="$HEALTH_KEY"; fi
          if [ "$LANDING_OK" != "true" ]; then signature="${signature:+$signature;}$LANDING_KEY"; fi
          signature=$(printf '%s' "$signature" | tr -cd 'A-Za-z0-9_,:;.-' | head -c 300)

          body=$(printf '%s\n\n- Health endpoint (`%s`): %s\n- Landing page (`%s`): %s\n\nLatest failing check: %s\nWorkflow run: %s\n\n<!-- uptime-signature: %s -->' \
            "Automated uptime check is failing. This body is rewritten on every failing run; a comment is added only when the failure signature changes." \
            "$HEALTH_URL" "$HEALTH_REASON" "$SITE_URL" "$LANDING_REASON" "$now" "$RUN_URL" "$signature")

          if [ -z "$number" ]; then
            gh label create "$ISSUE_LABEL" --repo "$GITHUB_REPOSITORY" \
              --color b60205 --description "Automated production uptime alerts" 2>/dev/null || true
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --label "$ISSUE_LABEL" --body "$body"
            exit 0
          fi

          previous=$(gh issue view "$number" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' \
            | sed -n 's/.*<!-- uptime-signature: \(.*\) -->.*/\1/p' | head -n 1 \
            | tr -cd 'A-Za-z0-9_,:;.-' | head -c 300)
          gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          if [ "$previous" != "$signature" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" \
              --body "Failure changed at $now: \`${signature}\` (was \`${previous:-unknown}\`). Run: $RUN_URL"
          fi

      # Make the run itself red when a check failed, so the Actions UI agrees
      # with the issue.
      - name: Fail when a check failed
        if: steps.health.outputs.ok != 'true' || steps.landing.outputs.ok != 'true'
        run: |
          echo "Uptime check failed. Health: $HEALTH_REASON. Landing: $LANDING_REASON."
          exit 1
        env:
          HEALTH_REASON: ${{ steps.health.outputs.reason }}
          LANDING_REASON: ${{ steps.landing.outputs.reason }}
