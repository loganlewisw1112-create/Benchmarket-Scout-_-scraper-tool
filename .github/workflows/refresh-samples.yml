name: Refresh real sample reports

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      catalog_ids:
        description: "Optional comma-separated catalog IDs to refresh"
        required: false
        type: string
      required_successes:
        description: "Successful refreshes required for this manual run"
        required: false
        default: "12"
        type: string

permissions:
  contents: read

concurrency:
  group: refresh-real-sample-reports
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SAMPLE_REFRESH_URL: https://benchmark-scout.vercel.app/api/sample-report/refresh
      SAMPLE_REFRESH_SECRET: ${{ secrets.SAMPLE_REFRESH_SECRET }}
      REQUESTED_CATALOG_IDS: ${{ inputs.catalog_ids || '' }}
      REQUIRED_SUCCESSES: ${{ inputs.required_successes || '12' }}
    steps:
      - name: Refresh every catalog entry sequentially
        shell: bash
        # Time budget (job timeout is 90 min = 5400 s):
        #   one attempt  <= 75 s (curl --max-time; the route's maxDuration is
        #                   60 s, so a function timeout surfaces as a 504)
        #   spacing       = 65 s between consecutive requests, none after the last
        #   first pass   <= 25 x 75 + 24 x 65 = 3435 s (57.3 min), always completes
        #   retries       = one per id, only for 503/504/network errors, queued
        #                   after the first pass; each costs <= 65 + 75 = 140 s and
        #                   is started only while it still fits before
        #                   DEADLINE_SECONDS (5100 s = 85 min), so in the worst
        #                   case about 11 retries run and the job still ends
        #                   before the 90-min timeout.
        run: |
          set -euo pipefail
          DEADLINE_SECONDS=5100
          SPACING_SECONDS=65
          MAX_ATTEMPT_SECONDS=75

          # Must equal the ids in data/real-samples/catalog.json
          # (lib/sample-catalog.test.ts enforces this).
          all_catalog=(
            hvac-absolute-air-solutions bakery-firebrand-bread dentistry-richard-tabor
            plumbing-berkeley-plumbing landscaping-rendered-stone law-andrew-dosa
            yoga-namaste auto-detailing-jg-mobile pet-grooming-alameda-mobile
            restaurant-speisekammer cafe-wescafe veterinary-oakland-veterinary
            physical-therapy-oso chiropractic-clinton barbering-als
            hair-salon-salon-1500 electrical-alameda-oakland roofing-bay-roofing
            florist-central-florist accounting-paul-lyon real-estate-cerda-zein
            cleaning-z-and-j gym-alameda-fitness daycare-little-blue-dolphins
            photography-clayton-mitchell
          )

          if [[ -n "${REQUESTED_CATALOG_IDS//[[:space:]]/}" ]]; then
            IFS=',' read -ra requested_catalog <<< "$REQUESTED_CATALOG_IDS"
            catalog=()
            for raw_catalog_id in "${requested_catalog[@]}"; do
              catalog_id="${raw_catalog_id#"${raw_catalog_id%%[![:space:]]*}"}"
              catalog_id="${catalog_id%"${catalog_id##*[![:space:]]}"}"
              if [[ -z "$catalog_id" ]]; then
                echo "catalog_ids contains an empty catalog ID."
                exit 1
              fi

              valid=false
              for known_catalog_id in "${all_catalog[@]}"; do
                if [[ "$catalog_id" == "$known_catalog_id" ]]; then
                  valid=true
                  break
                fi
              done
              if [[ "$valid" != true ]]; then
                echo "Unknown catalog ID: $catalog_id"
                exit 1
              fi
              for selected_catalog_id in "${catalog[@]}"; do
                if [[ "$catalog_id" == "$selected_catalog_id" ]]; then
                  echo "Duplicate catalog ID: $catalog_id"
                  exit 1
                fi
              done
              catalog+=("$catalog_id")
            done
          else
            # Rotate the starting index daily (day-of-year mod catalog size) so
            # no id is permanently last in line when upstreams are slow.
            day_of_year=$((10#$(date -u +%j)))
            start=$(( day_of_year % ${#all_catalog[@]} ))
            catalog=("${all_catalog[@]:start}" "${all_catalog[@]:0:start}")
            echo "Starting at index $start (${catalog[0]})."
          fi

          if ! [[ "$REQUIRED_SUCCESSES" =~ ^[1-9][0-9]*$ ]] ||
             (( REQUIRED_SUCCESSES > ${#catalog[@]} )); then
            echo "required_successes must be between 1 and ${#catalog[@]}."
            exit 1
          fi

          successes=0
          attempts=0
          requests_sent=0
          retry_queue=()
          skipped_retries=0

          # Sends one refresh. Sets last_outcome to one of:
          #   ok | retryable | failed | auth | maintenance
          refresh_once() {
            local catalog_id="$1"
            local response_body http_code code
            if (( requests_sent > 0 )); then sleep "$SPACING_SECONDS"; fi
            requests_sent=$((requests_sent + 1))
            attempts=$((attempts + 1))
            response_body="$(mktemp)"
            if http_code=$(curl --silent --show-error \
              --connect-timeout 10 --max-time "$MAX_ATTEMPT_SECONDS" \
              --output "$response_body" --write-out '%{http_code}' \
              --request POST "$SAMPLE_REFRESH_URL" \
              --header "content-type: application/json" \
              --header "x-sample-refresh-secret: $SAMPLE_REFRESH_SECRET" \
              --data "{\"catalogId\":\"$catalog_id\"}"); then
              if [[ "$http_code" =~ ^2 ]]; then
                successes=$((successes + 1))
                echo "Refreshed $catalog_id ($successes/$REQUIRED_SUCCESSES required)."
                last_outcome=ok
              else
                echo "Refresh failed for $catalog_id with HTTP $http_code:"
                sed -e 's/[[:cntrl:]]/ /g' "$response_body"
                echo
                code=$(jq -r '.code // empty' "$response_body" 2>/dev/null | tr -cd 'A-Z_' || true)
                if [[ "$http_code" == "401" ]]; then
                  last_outcome=auth
                elif [[ "$code" == "MAINTENANCE" ]]; then
                  last_outcome=maintenance
                elif [[ "$http_code" == "503" || "$http_code" == "504" ]]; then
                  last_outcome=retryable
                else
                  last_outcome=failed
                fi
              fi
            else
              echo "Refresh request failed for $catalog_id (network error or timeout)."
              last_outcome=retryable
            fi
            rm -f "$response_body"
          }

          handle_fatal_outcome() {
            if [[ "$last_outcome" == "auth" ]]; then
              echo "SAMPLE_REFRESH_SECRET mismatch (HTTP 401). Aborting remaining refreshes."
              exit 1
            fi
            if [[ "$last_outcome" == "maintenance" ]]; then
              echo "::warning::Production is in maintenance mode; sample refresh skipped."
              exit 0
            fi
          }

          # First pass: attempt every id once.
          for catalog_id in "${catalog[@]}"; do
            refresh_once "$catalog_id"
            handle_fatal_outcome
            if [[ "$last_outcome" == "retryable" ]]; then
              retry_queue+=("$catalog_id")
            fi
          done

          # Second pass: one retry per transiently failed id, while it fits.
          for catalog_id in "${retry_queue[@]}"; do
            if (( SECONDS + SPACING_SECONDS + MAX_ATTEMPT_SECONDS > DEADLINE_SECONDS )); then
              skipped_retries=$((skipped_retries + 1))
              continue
            fi
            echo "Retrying $catalog_id."
            refresh_once "$catalog_id"
            handle_fatal_outcome
          done

          echo "Refreshed $successes of ${#catalog[@]} catalog ids in $attempts attempts (retries queued=${#retry_queue[@]}, skipped for time=$skipped_retries)."
          if (( successes < REQUIRED_SUCCESSES )); then
            echo "Only $successes of $REQUIRED_SUCCESSES required samples refreshed."
            exit 1
          fi
