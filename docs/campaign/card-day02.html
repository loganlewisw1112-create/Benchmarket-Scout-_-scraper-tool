<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Day 2 — Live demo — 1080×1350</title>
    <link rel="stylesheet" href="campaign.css" />
  </head>
  <body>
    <!-- Day 2 · X + IG · hook: live demo · CTA: try it on your business

         /r/FQmMsIxR5Vc3 — JG Mobile Detailing, Oakland CA. Not a mockup. -->
    <div class="frame frame--portrait">
      <div class="card">
        <div class="lockup">
          <span class="wordmark">Benchmark Scout</span>
          <span class="pill">beta</span>
        </div>

        <div class="grow" style="display: flex; flex-direction: column; justify-content: center">
          <div class="stack-md">
            <p class="kicker">Real report &middot; Oakland, CA</p>
            <h1 class="headline headline--lg">

            </h1>

            <div>
              <div class="shot">
                <img src="assets/report-crop.png" alt="Benchmark Scout report showing score, market rank and the local competitor table" />
              </div>
              <p class="shot__cap">
                Actual output. Real competitors, discovered from public data &mdash;
                every figure traceable to its source.
              </p>
            </div>
          </div>
        </div>

        <div class="foot">
          <span class="cta">Try it on your business</span>
          <span class="url">benchmark-scout.vercel.app</span>
        </div>
      </div>
    </div>
