<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Day 13 — Feedback callout — 1080×1350</title>
    <link rel="stylesheet" href="campaign.css" />
  </head>
  <body>
    <!-- Day 13 · LI + X + IG · hook: feedback callout · CTA: 2-min feedback
         Destination is the in-app #feedback form that renders under every
         finished report (WaitlistForm, source="report") → /api/waitlist. -->
    <div class="frame frame--portrait">
      <div class="card">
        <div class="lockup">
          <span class="wordmark">Benchmark Scout</span>
          <span class="pill">beta</span>
        </div>

        <div class="grow" style="display: flex; flex-direction: column; justify-content: center">
          <div class="stack-md">
            <h1 class="headline headline--xl">
              You ran a report. What&rsquo;s the one thing it&rsquo;s missing?
            </h1>
            <div class="rule"></div>
            <p class="sub">
              Whatever you answer is the roadmap. Two minutes, in the box under
              your report.
            </p>
          </div>
        </div>

        <div class="foot">
          <span class="cta">Tell us what&rsquo;s missing</span>
          <span class="url">benchmark-scout.vercel.app/#feedback</span>
        </div>
      </div>
    </div>
  </body>
</html>
