<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Day 10 — Watch it change — 1080×1350</title>
    <link rel="stylesheet" href="campaign.css" />
  </head>
  <body>
    <!-- Day 10 · IG + LinkedIn · hook: before/after · CTA: run yours, re-run in 2 weeks
         Deliberately carries NO before/after numbers. Any specific rank movement
         would be invented, and this product's whole pitch is that it doesn't
         invent figures. The mechanic is sold with words, not fake data. -->
    <div class="frame frame--portrait">
      <div class="card">
        <div class="lockup">
          <span class="wordmark">Benchmark Scout</span>
          <span class="pill">beta</span>
        </div>

        <div class="grow" style="display: flex; flex-direction: column; justify-content: center">
          <div class="stack-md">
            <h1 class="headline headline--xl">
              Run it today. Run it again in two weeks.
            </h1>
            <div class="rule"></div>
            <p class="sub">
              A single snapshot tells you where you stand. Two tell you which
              direction you&rsquo;re moving &mdash; and that&rsquo;s the number
              worth acting on.
            </p>
          </div>
        </div>

        <div class="foot">
          <span class="cta">Run yours</span>
          <span class="url">benchmark-scout.vercel.app</span>
        </div>
      </div>
    </div>
  </body>
</html>
