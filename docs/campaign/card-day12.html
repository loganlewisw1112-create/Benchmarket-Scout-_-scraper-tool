<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Day 12 — Urgency / countdown — 1080×1920</title>
    <link rel="stylesheet" href="campaign.css" />
  </head>
  <body>
    <!-- Day 12 · X + IG Story · hook: urgency · CTA: claim
         The spot count is a PLACEHOLDER. It renders as highlighted "NN" so an
         unedited card is obviously unfinished and cannot be posted by mistake.
         Replace NN with the real remaining count before posting, then re-render. -->
    <div class="frame frame--story">
      <div class="card">
        <div class="lockup">
          <span class="wordmark">Benchmark Scout</span>
          <span class="pill">beta</span>
        </div>

        <div class="grow" style="display: flex; flex-direction: column; justify-content: center">
          <div class="stack-md">
            <p class="kicker">The Founding 100</p>
            <p class="bignum"><span class="ph">NN</span></p>
            <p class="bignum__unit">spots left</p>
            <div class="rule"></div>
            <p class="sub">
              Run one report. Give two minutes of feedback. Get three months of
              Recon free when it ships.
            </p>
          </div>
        </div>

        <div class="foot">
          <span class="cta">Claim yours</span>
          <span class="url">benchmark-scout.vercel.app</span>
        </div>
      </div>
    </div>
  </body>
</html>
